<section class="order section" id="order">
  <div class="container order-grid">
    <div class="order-copy">
      <p class="section-kicker">Order online</p>
      <h2>Fresh Harvest Box has got you covered</h2>
      <p>
        Tell us where to send your vegetables and which harvest notes matter.
        We will reply with the closest delivery window.
      </p>
      <form class="order-form" action="#" method="post">
        <label>
          <span>Name</span>
          <input type="text" name="name" placeholder="Your name" required />
        </label>
        <label>
          <span>Email</span>
          <input
            type="email"
            name="email"
            placeholder="you@example.com"
            pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$"
            required
          />
        </label>
        <label>
          <span>Comment</span>
          <textarea name="comment" placeholder="Tell us what you need"></textarea>
        </label>
        <button type="submit">Send</button>
      </form>
    </div>
    <div class="order-side">
      <img src="./src/images/order-box.svg" alt="Fresh harvest box with vegetables" width="480" height="360" loading="lazy" />
      <ul class="social-list" aria-label="GreenHarvest social links">
        <li><a href="https://www.instagram.com/goit.turkiye/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
        <li><a href="https://m.youtube.com/@GoITTurkey" target="_blank" rel="noopener noreferrer">YouTube</a></li>
        <li><a href="https://www.facebook.com/people/GOIT-T%C3%BCrkiye/61558036560161/" target="_blank" rel="noopener noreferrer">Facebook</a></li>
      </ul>
    </div>
  </div>
</section>
